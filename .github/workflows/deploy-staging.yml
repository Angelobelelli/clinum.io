name: Deploy - Staging

# Dispara automaticamente a cada merge em staging. Sem aprovação manual —
# staging é ambiente de homologação, não atende cliente real.
on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push das imagens Docker
    runs-on: ubuntu-latest
    outputs:
      api-tags: ${{ steps.meta-api.outputs.tags }}
      web-tags: ${{ steps.meta-web.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata da imagem da API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-api
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - name: Build & push apps/api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadata da imagem do Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-web
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - name: Build & push apps/web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via SSH + prisma migrate deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------------------
      # Servidor de staging (VPS única, Docker Compose) ainda não foi
      # provisionado neste repositório — o caminho/arquivo compose abaixo
      # é o esperado quando isso acontecer. Os secrets referenciados
      # (STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY) precisam ser
      # cadastrados manualmente em Settings > Secrets and variables >
      # Actions do repositório.
      # ---------------------------------------------------------------
      - name: Deploy no servidor de staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/clinum/staging
            docker compose pull
            docker compose up -d
            # prisma migrate deploy roda sempre como parte do deploy,
            # nunca manualmente.
            docker compose exec -T api pnpm --filter @clinum/api prisma:migrate:deploy
