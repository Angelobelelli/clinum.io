info:
  name: Update tipoVinculo/status de um member
  type: http
  seq: 1

http:
  method: PATCH
  url: '{{baseUrl}}/members/{{testMemberId}}/vinculo'
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Tenant-Slug
      value: '{{tenantSlug1}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  body:
    type: json
    data: |-
      {
        "tipoVinculo": "funcionario",
        "status": "ativo"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: 'tipoVinculo: "funcionario" | "parceiro_comissionado" (só relevante pra member com role=staff). status: "ativo" | "inativo". 403 se {{cookie_staff}}/{{cookie_reception}} tentar chamar isso (só owner/admin podem). 404 se testMemberId for de outra organização.'
