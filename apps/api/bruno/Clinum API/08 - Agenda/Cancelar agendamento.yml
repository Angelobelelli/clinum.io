info:
  name: Cancelar agendamento
  type: http
  seq: 4

http:
  method: PATCH
  url: '{{baseUrl}}/agendamentos/{{testAgendamentoId}}/cancelar'
  headers:
    - name: X-Tenant-Slug
      value: '{{tenantSlug1}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Muda status pra "cancelado" (não deleta o registro). Um agendamento cancelado libera o horário — o mesmo intervalo/profissional pode ser reagendado depois. reception também consegue chamar isso pra qualquer profissional.
