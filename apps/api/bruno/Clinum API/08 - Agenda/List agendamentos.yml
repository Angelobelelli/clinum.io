info:
  name: List agendamentos
  type: http
  seq: 2

http:
  method: GET
  url: '{{baseUrl}}/agendamentos?data=2026-09-01&profissionalId={{testProfissionalId}}'
  headers:
    - name: X-Tenant-Slug
      value: '{{tenantSlug1}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  params:
    - name: data
      value: 2026-09-01
      type: query
    - name: profissionalId
      value: '{{testProfissionalId}}'
      type: query
    - name: page
      value: '1'
      type: query
      disabled: true
    - name: perPage
      value: '20'
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: 'Filtros opcionais: data (YYYY-MM-DD, filtra pelo dia inteiro) e profissionalId. Troque Cookie pra {{cookie_staff}} pra confirmar que ele só vê os próprios agendamentos, mesmo sem passar profissionalId (o filtro por profissionalId da query é ignorado nesse caso).'
