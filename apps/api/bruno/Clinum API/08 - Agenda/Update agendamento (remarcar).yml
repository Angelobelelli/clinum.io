info:
  name: Update agendamento (remarcar)
  type: http
  seq: 3

http:
  method: PATCH
  url: '{{baseUrl}}/agendamentos/{{testAgendamentoId}}'
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Tenant-Slug
      value: '{{tenantSlug1}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  body:
    type: json
    data: |-
      {
        "dataHoraInicio": "2026-09-01T14:00:00.000Z",
        "dataHoraFim": "2026-09-01T15:00:00.000Z"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Todos os campos são opcionais (partial do create). Revalida choque de horário se dataHoraInicio/dataHoraFim/profissionalId mudarem. 403 se {{cookie_staff}} tentar mexer num agendamento que não é o próprio. 404 se testAgendamentoId for de outra organização.
