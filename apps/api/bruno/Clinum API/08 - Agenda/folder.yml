docs:
  content: 'AgendaController (apps/api/src/modules/agenda/) — agendamento de atendimento (patientId + profissionalId + intervalo). Regras: (1) choque de horário — não deixa criar/remarcar dois agendamentos sobrepostos pro mesmo profissional (cancelado não conta); (2) controle de acesso — owner/admin têm acesso total; reception cria/lê/atualiza/cancela de QUALQUER profissional mas NUNCA marca status (realizado/falta); staff só acessa os PRÓPRIOS agendamentos (profissionalId == o próprio Member), inclusive na criação. Todos os requests aqui precisam de X-Tenant-Slug. Use testProfissionalId = Member.id de um staff (ver 02 - Invite member + Get session/list-members pra descobrir o id) e testPatientId de 05 - Patients.'
  type: text/markdown
