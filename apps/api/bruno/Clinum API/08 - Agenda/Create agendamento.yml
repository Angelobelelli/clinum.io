info:
  name: Create agendamento
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseUrl}}/agendamentos'
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Tenant-Slug
      value: '{{tenantSlug1}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  body:
    type: json
    data: |-
      {
        "patientId": "{{testPatientId}}",
        "profissionalId": "{{testProfissionalId}}",
        "dataHoraInicio": "2026-09-01T10:00:00.000Z",
        "dataHoraFim": "2026-09-01T11:00:00.000Z",
        "observacao": "Primeira consulta"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: dataHoraFim precisa ser depois de dataHoraInicio (400 se não for). 409 se já existir um agendamento agendado/confirmado sobreposto pro mesmo profissionalId. Troque Cookie pra {{cookie_reception}} pra criar em nome de qualquer profissional, ou pra {{cookie_staff}} — nesse caso profissionalId TEM que ser o Member.id do próprio staff (403 se for de outro profissional).
