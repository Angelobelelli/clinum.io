info:
  name: Create organization (via Prisma direto)
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseUrl}}/organizations'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Clínica Direto Prisma",
        "slug": "clinica-direto-prisma",
        "vertical": "clinica_medica",
        "plano": "basico"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Único endpoint excluído do TenantMiddleware por ser "pré-tenant" (não existe domínio pra ele ainda). Não vincula a nenhum usuário/Member — é só pra popular dado de teste rápido.
