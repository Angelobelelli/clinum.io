info:
  name: Get my organization (por tenant resolvido)
  type: http
  seq: 2

http:
  method: GET
  url: '{{baseUrl}}/organizations/me'
  headers:
    - name: X-Tenant-Slug
      value: '{{tenantSlug1}}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Prova que TenantMiddleware resolveu o tenant certo. Em dev, use o header X-Tenant-Slug (não tem subdomínio real em localhost).
