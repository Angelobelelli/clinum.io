info:
  name: List all organizations (cross-tenant)
  type: http
  seq: 1

http:
  method: GET
  url: '{{baseUrl}}/platform-admin/organizations'
  headers:
    - name: Cookie
      value: '{{cookie_superadmin}}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: 200 + lista de TODAS as organizations (de todos os tenants) se logado como super_admin. 401 sem sessão. 403 se logado mas sem platformRole = super_admin. Grava AdminAuditLog com action = "list_organizations".
