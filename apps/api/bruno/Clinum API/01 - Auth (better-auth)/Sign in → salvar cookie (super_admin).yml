info:
  name: Sign in → salvar cookie (super_admin)
  type: http
  seq: 2

http:
  method: POST
  url: '{{baseUrl}}/api/auth/sign-in/email'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
  body:
    type: json
    data: |-
      {
        "email": "angelo@clinum.io",
        "password": "SuaSenhaForte123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const raw = bru.cookies.get('better-auth.session_token');\r

        if (raw) {\r

        \  bru.setCollectionVar('cookie_superadmin', 'better-auth.session_token=' + raw);\r

        \  console.log('cookie_superadmin atualizado');\r

        } else {\r

        \  console.warn('Nenhum cookie de sessão veio na resposta — sign-in falhou?');\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Loga e salva o cookie em {{cookie_superadmin}} (via script na aba Scripts → Post-response). Use esse e-mail como sua conta de super_admin.
