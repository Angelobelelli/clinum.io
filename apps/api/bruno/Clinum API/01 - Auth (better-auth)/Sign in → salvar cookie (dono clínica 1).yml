info:
  name: Sign in → salvar cookie (dono clínica 1)
  type: http
  seq: 3

http:
  method: POST
  url: '{{baseUrl}}/api/auth/sign-in/email'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
  body:
    type: json
    data: |-
      {
        "email": "dono@clinicateste.com",
        "password": "OutraSenhaForte123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const raw = bru.cookies.get('better-auth.session_token');\r

        if (raw) {\r

        \  bru.setCollectionVar('cookie_owner1', 'better-auth.session_token=' + raw);\r

        \  console.log('cookie_owner1 atualizado');\r

        } else {\r

        \  console.warn('Nenhum cookie de sessão veio na resposta — sign-in falhou?');\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Loga e salva o cookie em {{cookie_owner1}} — dono da organização em {{tenantSlug1}}.
