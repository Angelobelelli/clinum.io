info:
  name: Get session
  type: http
  seq: 7

http:
  method: GET
  url: '{{baseUrl}}/api/auth/get-session'
  headers:
    - name: Cookie
      value: '{{cookie_superadmin}}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retorna a sessão atual do cookie enviado — útil pra conferir platformRole/activeOrganizationId sem precisar decodificar nada. Troque o header Cookie pra {{cookie_owner1}}/{{cookie_staff}}/etc. pra checar outra sessão.
