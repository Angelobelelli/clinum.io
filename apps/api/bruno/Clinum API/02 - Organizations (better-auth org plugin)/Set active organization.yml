info:
  name: Set active organization
  type: http
  seq: 4

http:
  method: POST
  url: '{{baseUrl}}/api/auth/organization/set-active'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  body:
    type: json
    data: |-
      {
        "organizationId": "{{testOrganizationId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Seta activeOrganizationId na sessão — é esse valor que o TenantMatchGuard compara contra o tenant resolvido pelo domínio (ver tenant-match.guard.ts).
