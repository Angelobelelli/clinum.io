info:
  name: Update member role
  type: http
  seq: 8

http:
  method: POST
  url: '{{baseUrl}}/api/auth/organization/update-member-role'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  body:
    type: json
    data: |-
      {
        "memberId": "{{testMemberId}}",
        "role": "admin",
        "organizationId": "{{testOrganizationId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
