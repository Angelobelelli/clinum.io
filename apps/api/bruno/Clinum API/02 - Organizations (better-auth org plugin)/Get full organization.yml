info:
  name: Get full organization
  type: http
  seq: 3

http:
  method: GET
  url: '{{baseUrl}}/api/auth/organization/get-full-organization?organizationId={{testOrganizationId}}'
  headers:
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  params:
    - name: organizationId
      value: '{{testOrganizationId}}'
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
