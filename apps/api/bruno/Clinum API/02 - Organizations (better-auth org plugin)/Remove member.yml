info:
  name: Remove member
  type: http
  seq: 9

http:
  method: POST
  url: '{{baseUrl}}/api/auth/organization/remove-member'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  body:
    type: json
    data: |-
      {
        "memberIdOrEmail": "{{testMemberId}}",
        "organizationId": "{{testOrganizationId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
