info:
  name: Create organization
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseUrl}}/api/auth/organization/create'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  body:
    type: json
    data: |-
      {
        "name": "Clínica Teste",
        "slug": "{{tenantSlug1}}",
        "vertical": "clinica_medica"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Quem chama vira owner automaticamente. Diferente do POST /organizations (custom, ver pasta 03) que só insere direto no Prisma sem vincular a nenhum usuário.
