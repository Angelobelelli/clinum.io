info:
  name: Accept invitation
  type: http
  seq: 6

http:
  method: POST
  url: '{{baseUrl}}/api/auth/organization/accept-invitation'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_staff}}'
  body:
    type: json
    data: |-
      {
        "invitationId": "{{invitationId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Rode logado como a conta convidada (troque o Cookie pra {{cookie_staff}}/{{cookie_reception}} conforme o convite).
