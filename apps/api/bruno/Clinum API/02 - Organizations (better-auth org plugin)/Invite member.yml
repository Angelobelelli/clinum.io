info:
  name: Invite member
  type: http
  seq: 5

http:
  method: POST
  url: '{{baseUrl}}/api/auth/organization/invite-member'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  body:
    type: json
    data: |-
      {
        "email": "staff@clinicateste.com",
        "role": "staff",
        "organizationId": "{{testOrganizationId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: 'role aceita: owner, admin, member, staff, reception (ver access-control.ts). Requer sessão com permissão de convidar (owner/admin/reception). Use os e-mails staff@clinicateste.com / reception@clinicateste.com pra já bater com os requests de Sign in dessas contas em 01 - Auth.'
