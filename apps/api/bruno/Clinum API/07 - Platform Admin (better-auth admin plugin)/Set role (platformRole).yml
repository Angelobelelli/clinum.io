info:
  name: Set role (platformRole)
  type: http
  seq: 4

http:
  method: POST
  url: '{{baseUrl}}/api/auth/admin/set-role'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_superadmin}}'
  body:
    type: json
    data: |-
      {
        "userId": "{{testUserId}}",
        "role": "super_admin"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: role aqui é o platformRole ("user" ou "super_admin") — NADA a ver com role de Member/organização. Precisa de userId de verdade, não e-mail.
