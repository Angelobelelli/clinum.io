info:
  name: Ban user
  type: http
  seq: 5

http:
  method: POST
  url: '{{baseUrl}}/api/auth/admin/ban-user'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_superadmin}}'
  body:
    type: json
    data: |-
      {
        "userId": "{{testUserId}}",
        "banReason": "Teste manual"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Não dá pra banir a si mesmo (YOU_CANNOT_BAN_YOURSELF).
