info:
  name: Impersonate user
  type: http
  seq: 7

http:
  method: POST
  url: '{{baseUrl}}/api/auth/admin/impersonate-user'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_superadmin}}'
  body:
    type: json
    data: |-
      {
        "userId": "{{testUserId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: 'A resposta traz um cookie de sessão NOVO (do usuário impersonificado) — copie manualmente pra uma variável (ex: cookie_owner1) se quiser continuar agindo como ele nos próximos requests. Grava AdminAuditLog com action = "impersonate".'
