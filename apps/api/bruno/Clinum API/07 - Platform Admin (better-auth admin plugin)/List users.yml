info:
  name: List users
  type: http
  seq: 1

http:
  method: GET
  url: '{{baseUrl}}/api/auth/admin/list-users?limit=20'
  headers:
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_superadmin}}'
  params:
    - name: limit
      value: '20'
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
