info:
  name: Get user
  type: http
  seq: 2

http:
  method: GET
  url: '{{baseUrl}}/api/auth/admin/get-user?id={{testUserId}}'
  headers:
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_superadmin}}'
  params:
    - name: id
      value: '{{testUserId}}'
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
