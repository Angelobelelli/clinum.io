info:
  name: Revoke user session
  type: http
  seq: 10

http:
  method: POST
  url: '{{baseUrl}}/api/auth/admin/revoke-user-session'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_superadmin}}'
  body:
    type: json
    data: |-
      {
        "sessionToken": "{{sessionToken}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
