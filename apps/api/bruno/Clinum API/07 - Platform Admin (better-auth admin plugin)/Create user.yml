info:
  name: Create user
  type: http
  seq: 3

http:
  method: POST
  url: '{{baseUrl}}/api/auth/admin/create-user'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_superadmin}}'
  body:
    type: json
    data: |-
      {
        "email": "criado-por-admin@clinum.io",
        "password": "SenhaForte123!",
        "name": "Criado por Admin"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
