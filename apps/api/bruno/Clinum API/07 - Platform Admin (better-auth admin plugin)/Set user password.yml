info:
  name: Set user password
  type: http
  seq: 12

http:
  method: POST
  url: '{{baseUrl}}/api/auth/admin/set-user-password'
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: '{{trustedOrigin}}'
    - name: Cookie
      value: '{{cookie_superadmin}}'
  body:
    type: json
    data: |-
      {
        "userId": "{{testUserId}}",
        "newPassword": "NovaSenhaForte123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
