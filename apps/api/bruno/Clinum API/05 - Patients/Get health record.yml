info:
  name: Get health record
  type: http
  seq: 6

http:
  method: GET
  url: '{{baseUrl}}/patients/{{testPatientId}}/health-record'
  headers:
    - name: X-Tenant-Slug
      value: '{{tenantSlug1}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Troque Cookie pra {{cookie_reception}} pra confirmar o 403 (reception nunca vê ficha de saúde). {{cookie_staff}} também funciona (200).
