info:
  name: Create patient
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseUrl}}/patients'
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Tenant-Slug
      value: '{{tenantSlug1}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  body:
    type: json
    data: |-
      {
        "nome": "Maria da Silva",
        "cpf": "12345678901",
        "telefone": "11987654321",
        "email": "maria.silva@example.com",
        "dataNascimento": "1990-05-15"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Só `nome` é obrigatório. cpf precisa ter 11 dígitos numéricos (400 se inválido). reception também consegue chamar isso (troque Cookie pra {{cookie_reception}}).
