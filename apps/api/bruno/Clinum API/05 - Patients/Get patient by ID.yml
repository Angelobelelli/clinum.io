info:
  name: Get patient by ID
  type: http
  seq: 3

http:
  method: GET
  url: '{{baseUrl}}/patients/{{testPatientId}}'
  headers:
    - name: X-Tenant-Slug
      value: '{{tenantSlug1}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: 404 (não 403) se testPatientId pertencer a outra organização — teste trocando X-Tenant-Slug/Cookie pra outra clínica com o mesmo ID.
