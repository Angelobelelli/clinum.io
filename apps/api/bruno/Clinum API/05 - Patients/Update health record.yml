info:
  name: Update health record
  type: http
  seq: 7

http:
  method: PATCH
  url: '{{baseUrl}}/patients/{{testPatientId}}/health-record'
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Tenant-Slug
      value: '{{tenantSlug1}}'
    - name: Cookie
      value: '{{cookie_owner1}}'
  body:
    type: json
    data: |-
      {
        "alergias": "Dipirona",
        "historico": "Nenhum relevante",
        "observacoesClinicas": "Paciente colaborativo"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Troque Cookie pra {{cookie_reception}} pra confirmar o 403 (reception não pode atualizar ficha de saúde).
